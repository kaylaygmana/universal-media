services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: universal-media-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-universal-media}
      DB_USERNAME: ${MYSQL_APP_USER:-universal}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:-secret}
    volumes:
      # uploaded photos live in ./storage-data/public on the host (persist across rebuilds)
      - ./storage-data:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - universal-network

  mysql:
    image: mysql:8.0
    container_name: universal-media-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-universal-media}
      MYSQL_USER: ${MYSQL_APP_USER:-universal}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - universal-network

networks:
  universal-network:
    driver: bridge

volumes:
  mysql_data:
